<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root and the sentry service user can own the bus name -->
  <policy user="sentry">
    <allow own="org.freedesktop.SystemdSentry"/>
    <allow send_destination="org.freedesktop.SystemdSentry"/>
    <allow receive_sender="org.freedesktop.SystemdSentry"/>
  </policy>

  <policy user="root">
    <allow own="org.freedesktop.SystemdSentry"/>
    <allow send_destination="org.freedesktop.SystemdSentry"/>
    <allow receive_sender="org.freedesktop.SystemdSentry"/>
  </policy>

  <!-- Allow members of group wheel and adm to query status and inspect -->
  <policy group="wheel">
    <allow send_destination="org.freedesktop.SystemdSentry"/>
    <allow receive_sender="org.freedesktop.SystemdSentry"/>
  </policy>

  <policy group="adm">
    <allow send_destination="org.freedesktop.SystemdSentry"/>
    <allow receive_sender="org.freedesktop.SystemdSentry"/>
  </policy>

  <!-- Allow local inspection for all users -->
  <policy context="default">
    <allow send_destination="org.freedesktop.SystemdSentry"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.freedesktop.SystemdSentry"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
