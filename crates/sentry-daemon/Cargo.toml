[package]
name = "syntropd-sentry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Autonomous zero-trust systemd supervisor daemon and CLI"

[lib]
name = "sentry_daemon"
path = "src/lib.rs"

[dependencies]
sentry-core = { workspace = true }
sentry-driver = { workspace = true }
sentry-diagnostic = { workspace = true }
sentry-mcp = { workspace = true }
sentry-safety = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "systemd-sentry"
path = "src/main.rs"

[[bin]]
name = "sentry"
path = "src/bin/sentry.rs"

